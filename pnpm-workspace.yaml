packages:
  - '.'

overrides:
  vite: npm:rolldown-vite@7.1.14
  '@opentelemetry/core': 2.8.0
  systeminformation: 5.31.7
  fast-uri: 3.1.0
  socks: 2.8.7
  bare-path: 3.1.1
  bare-url: 2.5.2

allowBuilds:
  '@ast-grep/napi': true
  esbuild: true
  '@databricks/appkit': true
  '@databricks/appkit-ui': true
  protobufjs: true

# Keep pnpm's side-effects cache off. With it on, pnpm 11.0.8 restores @databricks/appkit and
# @databricks/appkit-ui from its shared store without their bundled @databricks/sdk-* packages on
# every install after the first one, and the build's `appkit plugin sync` step then fails.
sideEffectsCache: false
